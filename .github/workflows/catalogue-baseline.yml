name: Mohawk Catalogue Baseline
on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 23-30 11 *'
permissions:
  contents: read
concurrency:
  group: mohawk-hunt
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      DRY_RUN: '1'
      BASELINE_ONLY: '1'
      BASELINE_SECONDS: '2400'
      ENABLE_BROWSER: '0'
      REQUEST_DELAY_SECONDS: '3'
      MAX_PAGES_PER_CYCLE: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Restore previous catalogue
        uses: actions/cache/restore@v4
        with:
          path: state.sqlite3
          key: mohawk-state-${{ github.run_id }}
          restore-keys: |
            mohawk-state-
      - name: Build catalogue baseline
        run: python bot.py
      - name: Save catalogue baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.sqlite3
          key: mohawk-state-${{ github.run_id }}
      - name: Upload baseline database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mohawk-baseline-${{ github.run_id }}
          path: state.sqlite3
          if-no-files-found: ignore
          retention-days: 7
