name: Mohawk Hunt
on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Send one test Telegram message instead of scanning
        type: boolean
        default: false
  schedule:
    # November 2026 is GMT. GitHub scheduled jobs may start late.
    - cron: '55 12 23-30 11 *'
permissions:
  contents: read
concurrency:
  group: mohawk-hunt
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: 'gemini-2.5-flash'
      GEMINI_MAX_CALLS: '35'
      TELEGRAM_CHAT_ID: '9228500165'
      TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '0' }}
      CHECK_INTERVAL_SECONDS: '60'
      REQUEST_DELAY_SECONDS: '3'
      MAX_PAGES_PER_CYCLE: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install OCR and Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q
      - name: Check syntax
        run: python -m py_compile bot.py vision.py intelligence.py gemini_analysis.py catalog.py
      - name: Validate Telegram configuration
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Add TELEGRAM_BOT_TOKEN in repository Settings > Secrets and variables > Actions"
            exit 1
          fi
      - name: Restore prior scan state
        uses: actions/cache/restore@v4
        with:
          path: state.sqlite3
          key: mohawk-state-${{ github.run_id }}
          restore-keys: |
            mohawk-state-
      - name: Run Mohawk Finder
        run: python bot.py
      - name: Save scan state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.sqlite3
          key: mohawk-state-${{ github.run_id }}
      - name: Upload scan database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mohawk-state-${{ github.run_id }}
          path: state.sqlite3
          if-no-files-found: ignore
          retention-days: 3
